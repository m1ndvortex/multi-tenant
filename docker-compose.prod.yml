version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hesaabplus_postgres_prod
    environment:
      POSTGRES_DB: hesaabplus
      POSTGRES_USER: hesaab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - hesaabplus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesaab -d hesaabplus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hesaabplus_redis_prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - hesaabplus_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hesaabplus_backend_prod
    environment:
      - DATABASE_URL=postgresql://hesaab:${POSTGRES_PASSWORD}@postgres:5432/hesaabplus
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CLOUDFLARE_R2_ACCESS_KEY=${CLOUDFLARE_R2_ACCESS_KEY}
      - CLOUDFLARE_R2_SECRET_KEY=${CLOUDFLARE_R2_SECRET_KEY}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}
      - BACKBLAZE_B2_ACCESS_KEY=${BACKBLAZE_B2_ACCESS_KEY}
      - BACKBLAZE_B2_SECRET_KEY=${BACKBLAZE_B2_SECRET_KEY}
      - BACKBLAZE_B2_BUCKET=${BACKBLAZE_B2_BUCKET}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_API_URL=${SMS_API_URL}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hesaabplus_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hesaabplus_celery_prod
    environment:
      - DATABASE_URL=postgresql://hesaab:${POSTGRES_PASSWORD}@postgres:5432/hesaabplus
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CLOUDFLARE_R2_ACCESS_KEY=${CLOUDFLARE_R2_ACCESS_KEY}
      - CLOUDFLARE_R2_SECRET_KEY=${CLOUDFLARE_R2_SECRET_KEY}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}
      - BACKBLAZE_B2_ACCESS_KEY=${BACKBLAZE_B2_ACCESS_KEY}
      - BACKBLAZE_B2_SECRET_KEY=${BACKBLAZE_B2_SECRET_KEY}
      - BACKBLAZE_B2_BUCKET=${BACKBLAZE_B2_BUCKET}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_API_URL=${SMS_API_URL}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - celery_data:/app/celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hesaabplus_network
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app status || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hesaabplus_celery_beat_prod
    environment:
      - DATABASE_URL=postgresql://hesaab:${POSTGRES_PASSWORD}@postgres:5432/hesaabplus
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - backend_logs:/app/logs
      - celery_beat_data:/app/celery-beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hesaabplus_network
    command: celery -A app.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app status || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  super-admin-frontend:
    build:
      context: ./super-admin-frontend
      dockerfile: Dockerfile
      target: production
    container_name: hesaabplus_super_admin_prod
    environment:
      - VITE_APP_TYPE=super-admin
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_VERSION=2.0.0
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hesaabplus_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  tenant-frontend:
    build:
      context: ./tenant-frontend
      dockerfile: Dockerfile
      target: production
    container_name: hesaabplus_tenant_prod
    environment:
      - VITE_APP_TYPE=tenant
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_VERSION=2.0.0
      - NODE_ENV=production
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hesaabplus_network
    command: serve -s dist -l 3001
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: hesaabplus_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - super-admin-frontend
      - tenant-frontend
    networks:
      - hesaabplus_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  celery_data:
    driver: local
  celery_beat_data:
    driver: local

networks:
  hesaabplus_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16